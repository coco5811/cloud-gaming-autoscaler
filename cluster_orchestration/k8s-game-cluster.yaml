# ==========================================
# PART 1: SERVICE
# Exposes the game server to external traffic
# ==========================================

apiVersion: v1
kind: Service

metadata:
  name: game-server-service

spec:
  type: NodePort

  selector:
    app: game-server

  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30090


---
# ==========================================
# PART 2: DEPLOYMENT
# Creates and manages game server Pods
# ==========================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: game-server-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: game-server

  template:
    metadata:
      labels:
        app: game-server

    spec:
      containers:
        - name: game-lobby

          image: game-lobby:v1

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"

            limits:
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3


---
# ==========================================
# PART 3: HORIZONTAL POD AUTOSCALER
# Automatically increases/decreases Pods
# based on CPU utilization
# ==========================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: game-server-hpa

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: game-server-deployment

  minReplicas: 1

  maxReplicas: 5

  metrics:
    - type: Resource

      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 60